# ============ A股监控系统配置 ============

# 数据源顺序：依次尝试，全部失败时若允许 demo 则用合成数据
# tencent: 腾讯直连（股票/LOF/指数全覆盖，无需库依赖）
# akshare: 东财源；baostock: 免费K线；synthetic: 离线兜底
data_sources: ["tencent", "akshare", "baostock", "synthetic"]
allow_synthetic_fallback: true   # 网络不可用时降级为确定性合成数据（保证可运行）

# 自选池（股票 + ETF + LOF），code 类型自动识别（16/50/51/52/58=场内基金）
